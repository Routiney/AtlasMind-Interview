server.port=${SERVER_PORT:8200}
spring.codec.max-in-memory-size=1MB
plexus.core.base-url=${PLEXUS_CORE_BASE_URL:http://127.0.0.1:8100}
plexus.chat.memory-refresh-token-threshold=${CHAT_MEMORY_REFRESH_TOKEN_THRESHOLD:1200}
plexus.core.plan-timeout-seconds=${PLEXUS_CORE_PLAN_TIMEOUT_SECONDS:180}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/plexus_personal}
spring.datasource.username=${DB_USERNAME:plexus}
spring.datasource.password=${DB_PASSWORD:plexus}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:/mapper/**/*.xml

atlasmind.jwt.secret=${ATLAS_JWT_SECRET:atlasmind-development-secret-key-change-me-123456}
atlasmind.jwt.expiration-seconds=${ATLAS_JWT_EXPIRATION_SECONDS:3600}
atlasmind.dev-login=${ATLASMIND_DEV_LOGIN:false}
atlasmind.dev-login-password=${ATLASMIND_DEV_LOGIN_PASSWORD:atlasmind-dev-password-123456}
