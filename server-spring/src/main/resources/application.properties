server.port=${SERVER_PORT:8200}
spring.codec.max-in-memory-size=1MB
plexus.core.base-url=${PLEXUS_CORE_BASE_URL:http://127.0.0.1:8100}
plexus.chat.memory-refresh-token-threshold=${CHAT_MEMORY_REFRESH_TOKEN_THRESHOLD:1200}
plexus.chat.memory-cache-ttl=${CHAT_MEMORY_CACHE_TTL:24h}
plexus.chat.history-cache-ttl=${CHAT_HISTORY_CACHE_TTL:7d}
plexus.core.plan-timeout-seconds=${PLEXUS_CORE_PLAN_TIMEOUT_SECONDS:180}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/plexus_personal}
spring.datasource.username=${DB_USERNAME:plexus}
spring.datasource.password=${DB_PASSWORD:plexus}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.consumer.group-id=${KAFKA_DOCUMENT_CONSUMER_GROUP:atlas-document-processor}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:1}
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}
atlas.kafka.document-topic=${ATLAS_KAFKA_DOCUMENT_TOPIC:atlas.document-events.v1}
atlas.kafka.document-consumer-group=${ATLAS_KAFKA_DOCUMENT_CONSUMER_GROUP:atlas-document-processor}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:/mapper/**/*.xml

atlasmind.jwt.secret=${ATLAS_JWT_SECRET:atlasmind-development-secret-key-change-me-123456}
atlasmind.jwt.expiration-seconds=${ATLAS_JWT_EXPIRATION_SECONDS:3600}
atlasmind.dev-login=${ATLASMIND_DEV_LOGIN:false}
atlasmind.dev-login-password=${ATLASMIND_DEV_LOGIN_PASSWORD:atlasmind-dev-password-123456}
atlas.documents.max-bytes=${ATLAS_DOCUMENT_MAX_BYTES:10485760}
atlas.embedding.provider=${ATLAS_EMBEDDING_PROVIDER:local}
atlas.embedding.base-url=${ATLAS_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
atlas.embedding.model=${ATLAS_EMBEDDING_MODEL:text-embedding-v4}
atlas.embedding.dimensions=${ATLAS_EMBEDDING_DIMENSIONS:1024}
